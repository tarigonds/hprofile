name: Hprofile Actions
on: workflow_dispatch

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Install Java 25
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Build Maven project
      - name: Maven Test
        run: mvn test
      
      - name: Maven Checkstyle
        run: mvn checkstyle:checkstyle
    
    
     #setup sonarcloud 
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan and gate check
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=actions21
            -Dsonar.projectKey=devops26
            -Dsonar.sources=src/
            -Dsonar.java.binaries=target/classes
            -Dsonar.junit.reportPaths=target/surefire-reports/
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.qualitygate.wait=true 
            -Dsonar.qualitygate.timeout=600

  # ==========================================
  # JOB 2: BUILD AND PUBLISH DOCKER IMAGE TO ECR
  # ==========================================
  Build_And_Publish:
    needs: Testing
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Update application.properties with RDS credentials
      # Keep your existing sed commands and secret names here.
      - name: Update application.properties file
        run: |
          sed -i "s/^jdbc.username.*/jdbc.username=${{ secrets.RDS_USERNAME }}/" src/main/resources/application.properties
          sed -i "s/^jdbc.password.*/jdbc.password=${{ secrets.RDS_PASSWORD }}/" src/main/resources/application.properties
          sed -i "s|^jdbc.url.*|jdbc.url=${{ secrets.RDS_URL }}|" src/main/resources/application.properties

      # Build and push Docker image to AWS ECR
      - name: Build and Push Docker Image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
          access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry: ${{ secrets.ECR_REGISTRY }}
          repo: actapp
          region: ${{ env.AWS_REGION }}
          dockerfile: ./Dockerfile
          context: ./
          auto_tag: false
          tags: latest,${{ github.run_number }}