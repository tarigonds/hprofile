name: Hprofile Actions
on: workflow_dispatch
env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: actapp
  ECS_SERVICE: vproapp-act-svc
  ECS_CLUSTER: vproapp-act
  ECS_TASK_DEFINITION: aws-files/taskdeffile.json
  CONTINER _NAME: vproapp
Jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Install Java 25
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Build Maven project
      - name: Maven Test
        run: mvn test
      
      - name: Maven Checkstyle
        run: mvn checkstyle:checkstyle
    
    
     #setup sonarcloud 
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan and gate check
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=actions21
            -Dsonar.projectKey=devops26
            -Dsonar.sources=src/
            -Dsonar.java.binaries=target/classes
            -Dsonar.junit.reportPaths=target/surefire-reports/
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.qualitygate.wait=true 
            -Dsonar.qualitygate.timeout=600		
 # JOB 2: Build Docker Image and Push to AWS ECR
  Build_And_Publish:
    name: Build and Publish
    needs: Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/actapp:latest
            ${{ secrets.REGISTRY }}/actapp:${{ github.run_number }}
      
      - name: Update application.properties file
        run: |
          sed -i "s/^jdbc.username.*/jdbc.username\=${{secrets.RDS_USER}}/" src/main/resources/application.properties
          sed -i "s/^jdbc.password.*/jdbc.password\=${{secrets.RDS_PASS}}/" src/main/resources/application.properties
          sed -i "s/db01/${{secrets.RDS_ENDPOINT}}/" src/main/resources/application.properties
  Depoly:
    name: Build and Push
    needs: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION  }}
          container-name: ${{ env.CONTINER _NAME }}
          image: ${{ secrets.REGISTRY }}/${ env.ECR_REPOSITORY }:${{ github.run_number }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true